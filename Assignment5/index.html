<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        * {
            box-sizing: borderbox;
        }
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f8;
}
header {
    position:sticky;
    top:0;
    z-index: 10;
    background: #12203a;
    color: white;
    padding: 14px;
    text-align: center;
}
        .card {
    width: 280px;
    margin: 24px auto;
    background: white;
    border: 2px solid #2f5bea;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
}
    .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #2f5bea;
    color: white;
    font-size: 36px;
    line-height: 90px;
    margin: 0 auto 10px;
}
/* Step 5: Scrolling bio */
.bio {
    height: 80px;
     overflow: auto;
      text-align: left;
      border: 1px solid #ccd;
      padding: 8px;
      margin-top: 12px;
    font-size: 14px;
}
    </style>
</head>
<body>
    <div class="tobbar">
        <header>My Profile page</header>
    </div> 

    <div class="card">
    <div class="avatar">AP</div>
    <h2> Ayush Pratap</h2>
    <p>Web developer in making</p>
    <div class="bio">
            Hi! I am Ayush. I started learning coding this year.
            I like making websites and learning new technologies.
            My goal is to become a web developer.
            I am practising HTML and CSS to build better projects.
        </div>
    </div>
    <button class="fab">+</button>

</body>
</html>
